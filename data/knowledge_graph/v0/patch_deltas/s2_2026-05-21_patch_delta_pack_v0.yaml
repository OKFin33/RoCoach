    source_image_id: s2_patch_img_005
    old_text: 在场时，所有回合结束时效果，触发次数+1。
    new_text: 在场时，双方回合结束时的效果会额外触发1次。
  - move: 复方汤剂
    source_image_id: s2_patch_img_005
    old_text: 回合结束时，中毒效果触发次数+1。
    new_text: 在场时，双方回合结束时的中毒效果会额外触发1次。
