pm_review_decisions:
  - id: pm_2026-05-23_jazz_deer_stat_old_value_conflict
    applies_to: stat_deltas/爵士鹿
    decision: accept_s2_new_values_for_candidate_overlay
    rationale: S1 Battle Dex remains frozen as historical baseline; 爵士鹿 and 波普鹿 S1 physical attack values are uncertain enough that old-value mismatch should not block the S2 candidate overlay.
  - id: pm_2026-05-23_text_diffs_accepted
    applies_to:
      - ability_deltas/祭礼巨像/坠星
      - ability_deltas/波普鹿/超级电池
      - wording_only_skill_description_deltas/双向光速
    decision: accept_as_wording_only_old_text_differences
  - id: pm_2026-05-23_crop_entries_accepted
    applies_to:
      - stat_deltas/仪式巨像
      - stat_deltas/爵士鹿
      - stat_deltas/幻影荆棘
      - move_effect_deltas/地刺
    decision: accept_visible_extraction_as_sufficient_for_candidate_overlay
  - id: pm_2026-05-23_priority_concept_route
    applies_to: wording_only_skill_description_deltas/先手
    decision: route_to_b_layer_mechanism_concept
    source_image_id: s2_patch_img_005
    interpretation: 先手度 is analogous to Pokemon-style priority +x action priority; it is distinct from speed. The S2 screenshot explicitly states stackability, but this should be treated as documentation/clarification unless later evidence proves stackability itself changed in S2.
    content: 先手度是技能行动的优先级，先手度更高的技能忽略双方精灵速度差异，优先释放，先手度可叠加。

coverage:
  includes:
    - existing_species_stat_deltas
    - existing_species_ability_deltas
    - move_pool_additions_for_existing_species
    - move_effect_deltas
    - wording_only_skill_description_deltas
  excludes:
    - new_s2_species_base_records
    - runtime_observation_after_live_patch
    - direct_a_layer_db_overwrite

