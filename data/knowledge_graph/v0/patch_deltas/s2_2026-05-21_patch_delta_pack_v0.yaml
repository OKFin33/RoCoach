  - move: 暴风眼
    source_image_id: s2_patch_img_005
    old_text: 行动时连击数+100%。
    new_text: 获得连击数+100%。
  - move: 听桥
    source_image_id: s2_patch_img_005
    old_text: 减伤60%，应对攻击：对敌方造成物理伤害，威力与被应对技能相等。
    new_text: 减伤60%，应对攻击：对敌方造成武系物理伤害，威力与被应对技能相等。
  - move: 极限撕裂
    source_image_id: s2_patch_img_005
    old_text: 造成物伤，若生命高于50%，使用后自己获得双攻-50%。
    new_text: 造成物伤，若自己生命高于50%，使用后自己获得双攻-50%。
  - move: 化茧
    source_image_id: s2_patch_img_005
    old_text: 受到致命伤害时，获得1层萌化，并免疫此次伤害。
    new_text: 受到致命伤害时，获得1层萌化，并免疫此次伤害。（最多触发2次）
  - move: 小偷小摸
    source_image_id: s2_patch_img_005
    old_text: 入场时偷取所有敌方精灵2能量。
    new_text: 入场时偷取敌方场上所有精灵2能量。
