schema_version: p14.family_review_ledger.v0
last_updated: "2026-05-20"
identity_policy:
  required_for_new_pm_reviewed_entries_after: "2026-05-23"
  legacy_unknown_allowed_before: "2026-05-23"
  required_fields:
    - source_candidate.extractor_agent_id
    - source_candidate.extractor_run_id
    - review.reviewer_agent_id
    - review.reviewer_run_id
  legacy_note: "Entries accepted before this policy are backfilled as legacy_unknown. Do not infer true review independence from legacy_unknown alone."
review_scope_policy:
  family_level_review_allowed: true
  allowed_when:
    - set_family_has_at_least_two_primary_sources
    - set_family_has_at_least_two_repeated_core_moves
    - all_core_moves_resolve_to_a_layer_move_names
    - no_unresolved_asr_terms_in_promoted_fields
    - source_spans_present
  species_level_card_remains_blocked_when:
    - unresolved_split_hypotheses_exist_for_same_species
  runtime_promotion_policy:
    default_runtime_allowed: false
    family_review_is_not_runtime_promotion: true
    promotion_requires:
      - pm_reviewed_family_entry
      - reviewed_or_deferred_split_boundary_for_parent_species
      - materialized_species_set_card
      - graph_registry_and_indexes_rebuilt
      - strict_validators_pass
      - promotion_audit_log_entry
